# JIRA Query Templates

queries:
  # Main kernel BZ polling query
  kernel_cephfs_integration:
    name: "Kernel CephFS Integration Testing"
    description: "Query for RHEL kernel CephFS components in Integration or In Progress status"
    jql: |
      (project = RHEL
      and component = "kernel / File Systems / CephFS"
      and status = Integration
      and summary !~ rbd)
      or (project = RHEL
      and component = "kernel / File Systems / CephFS"
      and status = "In Progress"
      and "Preliminary Testing" != Pass
      and summary !~ rbd)
      ORDER BY "cf[10470]" ASC, summary ASC, assignee ASC
    fields:
      - key
      - summary
      - status
      - assignee
      - created
      - updated
      - description
      - customfield_10470  # Custom field for sorting
      - labels
      - components
    max_results: 100
    
  # Alternative query for specific status
  kernel_cephfs_integration_only:
    name: "Kernel CephFS Integration Status Only"
    description: "Query for RHEL kernel CephFS in Integration status only"
    jql: |
      project = RHEL
      and component = "kernel / File Systems / CephFS"
      and status = Integration
      and summary !~ rbd
      ORDER BY created DESC
    fields:
      - key
      - summary
      - status
      - assignee
      - description
    max_results: 50
    
  # Query for in-progress items
  kernel_cephfs_in_progress:
    name: "Kernel CephFS In Progress"
    description: "Query for RHEL kernel CephFS in In Progress status"
    jql: |
      project = RHEL
      and component = "kernel / File Systems / CephFS"
      and status = "In Progress"
      and "Preliminary Testing" != Pass
      and summary !~ rbd
      ORDER BY updated DESC
    fields:
      - key
      - summary
      - status
      - assignee
      - description
    max_results: 50

# Field mappings for parsing JIRA content
field_mappings:
  # Map JIRA fields to internal field names
  jira_key: "key"
  jira_summary: "summary"
  jira_status: "status"
  jira_assignee: "assignee"
  jira_description: "description"
  jira_created: "created"
  jira_updated: "updated"
  
# Section identifiers in JIRA description
section_identifiers:
  kernel_version:
    patterns:
      - "kernel version:"
      - "kernel:"
      - "version:"
    regex: "(?i)kernel\\s*version[:\\s]+([\\d\\.\\-_a-z]+)"
    
  build_info:
    patterns:
      - "build:"
      - "rhbuild:"
    regex: "(?i)(?:rh)?build[:\\s]+(\\d+\\.\\d+)"
    
  platform:
    patterns:
      - "platform:"
      - "rhel version:"
    regex: "(?i)platform[:\\s]+(rhel-\\d+)"
    
  test_suite:
    patterns:
      - "test suite:"
      - "suite:"
    regex: "(?i)(?:test\\s+)?suite[:\\s]+([\\w\\-/\\.]+)"
    
  artifacts_url:
    patterns:
      - "artifacts:"
      - "artifact url:"
      - "cki artifacts:"
    regex: "(https?://artifacts\\.internal\\.cki-project\\.org/[^\\s]+)"
    
  inventory:
    patterns:
      - "inventory:"
      - "inventory file:"
    regex: "(?i)inventory[:\\s]+([\\w\\-/\\.]+\\.yaml)"

# Default values if not found in JIRA
defaults:
  rhbuild: "9.1"
  platform: "rhel-9"
  cloud: "openstack"
  log_level: "DEBUG"
  global_conf: "conf/squid/cephfs/kernel_verification.yaml"
  suite: "suites/tentacle/cephfs/kernel_pre_verification.yaml"
  osp_cred: "osp/osp-cred-ci-2.yaml"
  inventory: "conf/inventory/rhel-9.4-server-x86_64.yaml"
  build: "stable"

