services:
  kernel-bz-polling:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kernel-bz-polling
    env_file:
      - ../.env

    volumes:
      # Persist all runtime data (logs, caches, execution records)
      - ../data:/app/data

      # Config (read-only mount so container picks up any local edits)
      - ../config:/app/config:ro

      # SSH key for remote log transfer (scp)
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro

      # CephCI config (required by cephci run.py for subscription manager etc.)
      - ~/.cephci.yaml:/root/.cephci.yaml:ro

      # Remote log storage (mount if running on the same host as log storage)
      # - /ceph/ceph-qe-logs:/ceph/ceph-qe-logs

      # CephCI repo - mount if already cloned locally, otherwise entrypoint clones it
      - ${CEPHCI_LOCAL_PATH:-./cephci}:/app/cephci

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    # ---------- override the default CMD for different run modes ----------
    # Full pipeline (default):
    #   docker compose up
    #
    # Execute-only (re-run Phase 4 from saved data):
    #   docker compose run --rm kernel-bz-polling python3 -m src.main --execute-only --yes
    #
    # Execute specific JIRAs:
    #   docker compose run --rm kernel-bz-polling python3 -m src.main --execute-only --yes --jira-ids RHEL-142095
    #
    # Dry run:
    #   docker compose run --rm kernel-bz-polling python3 -m src.main --dry-run
